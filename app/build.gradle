plugins {
    id 'de.nanogiants.android-versioning' version '2.4.0'
    id 'com.android.application'
}

android {
    namespace 'com.huc.android_ble_monitor'
    compileSdk 36// ← 添加这一行！
    // ← 更新到较新版本
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "com.huc.android_ble_monitor"
        minSdk 21
        targetSdk 34  // ← 更新到较新版本
        archivesBaseName = "BLEM"
        versionCode versioning.getVersionCode()
        versionName versioning.getVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            moduleName "hciviewer"
        }

        // 添加构建配置字段（如果需要）
        buildConfigField "String", "APPLICATION_ID", "\"$applicationId\""
    }

    signingConfigs {
        release {
            storeFile file("store.jks")
            storePassword "secret"
            keyAlias "store"
            keyPassword "secret"
        }
    }

    lint {
        abortOnError = false
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            // 为调试版本添加配置（可选）
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    packaging {
        jniLibs {
            // 确保 native 库支持 16 KB 页面大小
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    // 移除 repositories 块，它不应该在 android 块内
}

// 将 repositories 移到这里
repositories {
    google()
    mavenCentral()  // 使用 mavenCentral 替代 jcenter
    // jcenter()  // ← 注释掉或删除，因为 jcenter 已关闭
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.google.code.gson:gson:2.8.6'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'pub.devrel:easypermissions:3.0.0'

    implementation 'com.google.android.material:material:1.13.0'

    // Livecycle Components - 更新到新版本
    def lifecycle_version = '2.6.2'
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"

    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.recyclerview:recyclerview-selection:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'com.rockerhieu:rv-adapter-states:1.2'
}

// Task to print version for CI/CD
task printVersion {
    doLast {
        println versioning.getVersionName()
    }
}