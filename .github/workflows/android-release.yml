name: Android Release

on:
  push:
    tags:
      - 'v*'  # 触发条件: 推送 v* 标签 (如 v1.0.0)
  workflow_dispatch:  # 允许手动触发

jobs:
  release-build:
    name: Build Release APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Decode Keystore
      if: ${{ secrets.SIGNING_KEY != '' }}
      run: |
        echo "${{ secrets.SIGNING_KEY }}" | base64 -di > app/store.jks
    
    - name: Build Release APK
      run: |
        if [ -f "app/store.jks" ] && [ -n "${{ secrets.SIGNING_STORE_PASSWORD }}" ]; then
          echo "Building signed release APK..."
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/store.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.SIGNING_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.SIGNING_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.SIGNING_KEY_PASSWORD }}
        else
          echo "Building unsigned release APK..."
          ./gradlew assembleRelease
        fi
    
    - name: Get version name
      id: version
      run: |
        VERSION=$(./gradlew -q printVersion | tail -n 1)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Rename APK
      run: |
        mkdir -p release-apk
        cp app/build/outputs/apk/release/*.apk release-apk/BLEM-${{ steps.version.outputs.version }}-release.apk || \
        cp app/build/outputs/apk/release/*.apk release-apk/
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: release-apk/*.apk
        retention-days: 30
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: release-apk/*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
